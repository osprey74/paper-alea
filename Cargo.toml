[workspace]
resolver = "2"
# ホストで `cargo test` できる言語非依存ロジックのみをメンバーにする。
# firmware/alea-fw は Xtensa ターゲットのため exclude（ホスト cargo test を汚さない）。
members = ["crates/alea-core"]
exclude = ["firmware/alea-fw"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/osprey74/paper-alea"
authors = ["osprey74"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
